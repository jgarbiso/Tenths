[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenths"
version = "0.1.0"
description = "iRacing telemetry analysis and coaching tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Justin Garbiso"}
]
dependencies = [
    "pyirsdk",
    "pandas",
    "numpy",
]

[project.scripts]
tenths = "tenths.cli:main"

[tool.setuptools.packages.find]
where = ["."]
