[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenths"
version = "0.9.0"
description = "iRacing telemetry analysis and coaching tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Justin Garbiso"}
]
dependencies = [
    "pyirsdk>=1.3,<2.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "watchdog>=3.0,<5.0",
    "winotify>=1.1,<2.0",
    "pystray>=0.19,<1.0",
    "Pillow>=10.0,<12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
tenths = "tenths.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
