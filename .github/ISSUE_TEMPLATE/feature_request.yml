name: Feature Request
description: Suggest an improvement or new feature
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      placeholder: Describe the feature or improvement
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Why is this useful to you?
      placeholder: What problem does this solve for your driving?
    validations:
      required: false
